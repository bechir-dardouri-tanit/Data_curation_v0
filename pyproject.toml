[project]
name = "medrl"
version = "0.1.0"
description = "Bilingual (EN+FR) medical reasoning LLM post-training stack for Qwen3.5"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Core deps are deliberately light and torch-free: `medrl.core`, `medrl.eval.extraction`,
# `medrl.eval.verifiers` and `medrl.analysis` must import on a CPU-only box with no ML stack,
# so that config validation, parsing, scoring and statistics are testable in CI without a GPU.
dependencies = [
    "pydantic>=2.9",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "typer>=0.15",
    "rich>=13.9",
    "numpy>=2.1",
    "pyyaml>=6.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
# Evaluation harness: Inspect AI tasks, dataset loading, judge clients.
eval = [
    "inspect-ai>=0.3.130",
    "datasets>=3.2",
    "huggingface-hub>=0.27",
    "openai>=1.59",
    "tenacity>=9.0",
    "jinja2>=3.1",
]
# Data pipeline: dedup, decontamination, language ID, columnar joins.
data = [
    "datasets>=3.2",
    "datasketch>=1.6",
    "duckdb>=1.1",
    "pyarrow>=18.0",
    "regex>=2024.11",
]
# Curation pipeline (S0-S15): heavy storage/query stack for the training-corpus build.
# Pins researched 2026-09-26 -- see docs/CURATION_IMPLEMENTATION_PLAN.md section 1.2.
curation = [
    "duckdb==1.5.5",
    "datatrove[io]~=0.10.0",
    "datasketch==2.0.0",
    "usearch==2.26.2",
    "ladybug==0.20.4",          # KG store: maintained community continuation of kuzu (archived 2025-10-10)
    "xxhash>=3.5,<4.0",
]
# Entity linking / terminology (S7-S10). Licence-gated: needs UMLS 2025AB (or the OMOP
# fallback) plus SNOMED CT FR from the ANS NRC; installed only on the curation node.
entity = [
    "medcat==2.9.0",            # MedCAT v2 (cogstack-nlp); v1 archived 2025-07-28
    "edsnlp==0.23.0",           # FR linking without UMLS: eds.drugs/eds.cim10/eds.adicap + span_linker
    "scispacy==0.6.2",          # optional EN ensemble; caps python <3.13
]
# Training. Installed only on GPU nodes.
train = [
    "torch>=2.6",
    "transformers>=4.57.0",
    "accelerate>=1.2",
    "safetensors>=0.4.5",
    "peft>=0.14",
    "liger-kernel>=0.5",
]
# Rollout + RL. `verl` and `vllm` are pinned by commit/version in uv.lock, not floated:
# the algorithm registry we build on (cispo/sapo/gdpo/rollout-correction) moves fast upstream.
rl = [
    "vllm>=0.11",
    "ray>=2.40",
]
track = ["wandb>=0.19"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "types-PyYAML",
]

[project.scripts]
medrl = "medrl.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medrl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # typer uses function calls in argument defaults by design
    "RUF012", # pydantic/class-level mutable defaults are fine here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# Heavy optional deps are absent on CPU-only dev boxes; don't fail typing on them.
[[tool.mypy.overrides]]
module = [
    "torch.*", "transformers.*", "safetensors.*", "vllm.*", "verl.*",
    "inspect_ai.*", "datasets.*", "wandb.*", "datasketch.*", "duckdb.*",
    "liger_kernel.*", "peft.*", "accelerate.*", "huggingface_hub",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a working CUDA device",
    "network: requires network access (Hub downloads)",
    "slow: long-running (minutes)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/medrl"]
