name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {python-version: "3.12"}
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/mypy src/medrl
      - run: .venv/bin/python -m pytest -q
      - name: config presets validate
        run: |
          .venv/bin/medrl eval plan -c decision_grade --dry-run
          .venv/bin/medrl eval plan -c fast --dry-run
          .venv/bin/medrl eval plan -c fr --dry-run
