# EuroLLM-9B-MeditronFO baseline evaluation
# EPFLiGHT/EuroLLM-9B-MeditronFO - Medical fine-tuned 9B model

model:
  hf_id: EPFLiGHT/EuroLLM-9B-MeditronFO
  revision: null
  path: null
  dtype: bfloat16
  attn_implementation: flash_attention_2
  text_only: true
  trust_remote_code: false

cluster:
  name: local_2xh100
  num_gpus: 2
  gpu_memory_gb: 80
  train_strategy: lora
  rollout_placement: sequential
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 4096  # EuroLLM-9B max context is 4096
  global_batch_tokens: 262144
  max_num_seqs: 400

benchmarks:
  # Decision-grade benchmarks
  - name: medqa
    loader: medqa
    grade: decision
    language: en
    hf_id: openlifescienceai/medqa
    split: test
    subset: null
    limit: null
    requires_judge: false

  - name: medmcqa
    loader: medmcqa
    grade: decision
    language: en
    hf_id: openlifescienceai/medmcqa
    split: validation
    subset: null
    limit: null
    requires_judge: false

  - name: mmlu_pro_health
    loader: mmlu_pro
    grade: decision
    language: en
    hf_id: TIGER-Lab/MMLU-Pro
    split: test
    subset: health
    limit: null
    requires_judge: false

  - name: medxpertqa_text
    loader: medxpertqa
    grade: decision
    language: en
    hf_id: TsinghuaC3I/MedXpertQA
    split: test
    subset: Text
    limit: null
    requires_judge: false

  - name: medcalc
    loader: medcalc
    grade: decision
    language: en
    hf_id: ncbi/MedCalc-Bench
    split: test
    subset: null
    limit: null
    requires_judge: false

  - name: mediqal
    loader: mediqal
    grade: decision
    language: fr
    hf_id: ANR-MALADES/MediQAl
    split: test
    subset: mcqu
    limit: null
    requires_judge: false

  - name: healthbench_hard
    loader: healthbench
    grade: decision
    language: en
    hf_id: openai/healthbench
    split: test
    subset: hard
    limit: null
    requires_judge: true

sampling:
  temperature: 0.6
  top_p: 0.95
  top_k: 40
  n_repeats: 4
  seed: 0
  max_tokens: 4096  # EuroLLM-9B max context is 4096
  presence_penalty: 0.0

thinking:
  mode: "off"  # No built-in thinking mode
  think_budget: 0
  answer_budget: 2048
  prefill_think: false
  strict_incomplete: true

judge: fast

serving: sequential

tracking:
  enabled: true
  backend: wandb
  project: medrl
  entity: null
  group: null
  tags: ["baseline", "eurollm-9b-meditron", "decision-grade"]
  log_samples: true

output_dir: null
max_extraction_fail_rate: 0.20  # After extraction fixes
