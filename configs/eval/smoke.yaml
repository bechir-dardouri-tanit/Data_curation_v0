# End-to-end proof of the whole loop (serve -> generate -> grade -> score -> records)
# before any long baseline run. Small limits, two repeats so the repeatability signal
# exists, no judge (MCQA only).
#
# Serves the hub checkpoint with --language-model-only: vLLM's Qwen3_5ForCausalLM
# expects flattened model.* keys, while the converted text-only checkpoint keeps the
# transformers-native model.language_model.* nesting -- that one is the training-side
# artifact, not a serving one.
model:
  hf_id: Qwen/Qwen3.5-9B
  text_only: true
cluster: local_2xh100
sampling: {temperature: 0.6, top_p: 0.95, top_k: 40, n_repeats: 2, seed: 0, max_tokens: 10240}
thinking: {mode: "on", think_budget: 8192, answer_budget: 2048}
serving: sequential
benchmarks:
  - {name: medqa, loader: medqa, limit: 12}
  - {name: medmcqa, loader: medmcqa, limit: 12}
