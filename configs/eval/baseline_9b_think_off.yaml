# Baseline: untouched Qwen3.5-9B, thinking OFF via the chat-template toggle.
# Qwen's recommended non-thinking sampling: temperature 0.7 / top_p 0.8.
# Same benchmark set as baseline_9b_think_on so the thinking delta is a paired comparison.
model:
  hf_id: Qwen/Qwen3.5-9B
  text_only: true
cluster: local_2xh100
sampling: {temperature: 0.7, top_p: 0.8, top_k: 40, n_repeats: 4, seed: 0, max_tokens: 2048}
thinking: {mode: "off", think_budget: 0, answer_budget: 2048}
serving: sequential
judge: fast
benchmarks: [medqa, medmcqa, mmlu_pro_health, medxpertqa_text, medcalc, mediqal, healthbench_hard]
