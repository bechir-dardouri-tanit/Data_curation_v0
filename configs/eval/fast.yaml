# Ablation-grade iteration: small subsets, few repeats, fast judge. Rankings only.
model:
  hf_id: Qwen/Qwen3.5-9B
  text_only: true
cluster: local_2xh100
sampling: {temperature: 0.6, top_p: 0.95, top_k: 40, n_repeats: 4, seed: 0, max_tokens: 8192}
thinking: {mode: "on", think_budget: 4096, answer_budget: 1536}
serving: split_gpu
judge: fast
benchmarks: [medqa, medmcqa, medxpertqa_text]
